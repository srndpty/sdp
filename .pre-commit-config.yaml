# commit 時は高速な処理だけを実行する。
# Pyright と pytest 全件は scripts/check.ps1 と CI で実行する。
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        exclude: '\.md$'
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: mixed-line-ending
        args: [--fix=lf]
        exclude: '\.ps1$'

  - repo: https://github.com/astral-sh/ruff-pre-commit
    # pyproject.toml の dev 依存の Ruff とバージョンを揃える
    rev: v0.16.0
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
