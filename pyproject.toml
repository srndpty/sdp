[project]
name = "sdp"
version = "0.0.1"
description = "Windows 11 向け個人用ローカル音声プレイヤー sdp (sound player)"
readme = "README.md"
requires-python = ">=3.13,<3.15"
license = { text = "MIT" }
dependencies = [
    # P0（技術検証）で必要になるものだけを入れている。
    # Mutagen などは必要になったフェーズで追加する。
    "PySide6>=6.10,<6.11",
    "numpy>=2.1",
]

[project.scripts]
sdp = "sdp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sdp"]

[dependency-groups]
dev = [
    "ruff>=0.14",
    "pyright>=1.1.400",
    "pytest>=8.3",
    "pytest-qt>=4.4",
    "pytest-cov>=6.0",
    "coverage>=7.6",
    "pre-commit>=4.0",
    "pyinstaller>=6.11",
]

# ---------------------------------------------------------------------------
# Ruff（lint と format の双方に使用）
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]
extend-exclude = ["spike"]

[tool.ruff.lint]
# 個人開発で継続運用できる範囲に絞る。docstring 強制（D）は入れない。
select = [
    "F",    # pyflakes
    "E",    # pycodestyle error
    "I",    # import 順
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "C4",   # 不自然な内包表記
    "PIE",  # 冗長・不自然なコード
    "TRY",  # 不要・不適切な例外処理
    "RUF",  # Ruff 固有の有用な規則
]
ignore = [
    # 例外メッセージのリテラル直書きを禁じる規則。個人開発では冗長なため無効化する。
    "TRY003",
    # 全角括弧などを「紛らわしい文字」として検出する規則。
    # 本プロジェクトはコメント・docstring・文字列を日本語で書く方針のため無効化する。
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
# テストでは意図的に例外を発生させる記述が多く、TRY 系が過剰に反応するため緩める。
"tests/**" = ["TRY"]

[tool.ruff.lint.isort]
known-first-party = ["sdp"]

[tool.ruff.format]
docstring-code-format = true

# ---------------------------------------------------------------------------
# Pyright（新規プロジェクトのため strict を採用）
# ---------------------------------------------------------------------------
[tool.pyright]
include = ["src", "tests", "tools"]
exclude = ["**/__pycache__", ".venv", "spike", "build", "dist"]
pythonVersion = "3.13"
pythonPlatform = "Windows"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"
# PySide6 由来の型情報の問題は、プロジェクト全体を緩めるのではなく
# 該当行の局所的な pyright ignore コメント（理由付き）で抑制する。

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-config --strict-markers"
markers = [
    "audio: 実際の音声デバイスや実音再生を必要とするテスト（CI からは除外する）",
]
qt_api = "pyside6"

# ---------------------------------------------------------------------------
# coverage
# ---------------------------------------------------------------------------
[tool.coverage.run]
branch = true
source = ["src/sdp"]

[tool.coverage.report]
fail_under = 80
show_missing = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    'if __name__ == "__main__":',
]

[tool.coverage.xml]
output = "coverage.xml"
